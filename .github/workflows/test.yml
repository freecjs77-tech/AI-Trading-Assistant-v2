name: Tests

# PR/푸시 시 pytest 스위트를 돌려 시그널/리포트 로직 회귀를 배포 전에 차단.
# 테스트는 완전 오프라인(yfinance 네트워크 미사용)이라 수 초 내 완료된다.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
